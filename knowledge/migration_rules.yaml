schema_version: 1
rules_version: "2026.09.26-d7.1"

rules:
  - id: RSA-SIGNATURE-001
    priority: 100
    match:
      primitive_contains: ["rsa"]
      roles: ["signature"]
      statuses: ["quantum_vulnerable"]
    plan:
      target_algorithm: "ML-DSA assessment"
      target_standard: "FIPS 204"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "Signature format, verifier support, key lifecycle, and protocol compatibility require review."
      estimated_effort: "medium"
      blocker_codes: ["SIGNATURE_FORMAT", "VERIFIER_SUPPORT", "KEY_LIFECYCLE", "PROTOCOL_COMPATIBILITY"]
      standard_refs: ["https://csrc.nist.gov/pubs/fips/204/final"]

  - id: RSA-KEY-TRANSPORT-001
    priority: 100
    match:
      primitive_contains: ["rsa"]
      roles: ["key_transport"]
      statuses: ["quantum_vulnerable"]
    plan:
      target_algorithm: "ML-KEM-based KEM/DEM redesign"
      target_standard: "FIPS 203"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "RSA key transport requires coordinated sender, recipient, and data-format redesign."
      estimated_effort: "high"
      blocker_codes: ["RECIPIENT_COMPATIBILITY", "DATA_FORMAT", "DECRYPT_PATH", "KEY_LIFECYCLE"]
      standard_refs: ["https://csrc.nist.gov/pubs/fips/203/final"]

  - id: RSA-ENCRYPTION-001
    priority: 90
    match:
      primitive_contains: ["rsa"]
      roles: ["encryption"]
      statuses: ["quantum_vulnerable"]
    plan:
      target_algorithm: "Manual KEM/DEM redesign assessment"
      target_standard: "FIPS 203"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "The encrypted value's purpose is unresolved, so key transport cannot be assumed."
      estimated_effort: "high"
      blocker_codes: ["PLAINTEXT_PURPOSE_UNKNOWN", "RECIPIENT_COMPATIBILITY", "DATA_FORMAT"]
      standard_refs: ["https://csrc.nist.gov/pubs/fips/203/final"]

  - id: HYBRID-KEY-ESTABLISHMENT-001
    priority: 80
    match:
      primitive_contains: ["x25519", "ecdh", "diffie-hellman", "dh ("]
      roles: ["key_establishment"]
      statuses: ["quantum_vulnerable"]
    plan:
      target_algorithm: "X25519MLKEM768 assessment"
      target_standard: "RFC 10024"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "Both peers and the deployed TLS provider must support and negotiate the selected hybrid group."
      estimated_effort: "high"
      blocker_codes: ["PEER_COMPATIBILITY", "TLS_PROVIDER_SUPPORT", "NEGOTIATION_EVIDENCE"]
      standard_refs: ["https://www.rfc-editor.org/rfc/rfc10024.html"]

  - id: CLASSICAL-SIGNATURE-001
    priority: 70
    match:
      primitive_contains: ["ecdsa", "ed25519", "ed448", "dsa"]
      roles: ["signature"]
      statuses: ["quantum_vulnerable"]
    plan:
      target_algorithm: "ML-DSA or SLH-DSA assessment"
      target_standard: "FIPS 204 / FIPS 205"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "Signature encoding, verifier support, certificate use, and key lifecycle require review."
      estimated_effort: "medium"
      blocker_codes: ["SIGNATURE_FORMAT", "VERIFIER_SUPPORT", "CERTIFICATE_PROFILE", "KEY_LIFECYCLE"]
      standard_refs:
        - "https://csrc.nist.gov/pubs/fips/204/final"
        - "https://csrc.nist.gov/pubs/fips/205/final"

  - id: SYMMETRIC-AES-001
    priority: 50
    match:
      primitive_contains: ["aes"]
      roles: ["encryption"]
      statuses: ["quantum_security_reduced"]
    plan:
      target_algorithm: "AES-256 assessment"
      target_standard: "FIPS 197"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "Actual key size, mode, rotation process, and compatibility must be established."
      estimated_effort: "medium"
      blocker_codes: ["KEY_SIZE_UNKNOWN", "MODE_UNKNOWN", "ROTATION_REQUIRED"]
      standard_refs: ["https://csrc.nist.gov/pubs/fips/197/final"]

  - id: HASH-MD5-001
    priority: 60
    match:
      primitive_contains: ["md5"]
      roles: ["hash"]
      statuses: ["deprecated_classically"]
    plan:
      target_algorithm: "SHA-256 or SHA3-256 assessment"
      target_standard: "FIPS 180-4 / FIPS 202"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "Hash purpose and compatibility requirements must be established before replacement."
      estimated_effort: "low"
      blocker_codes: ["HASH_PURPOSE_UNKNOWN", "FORMAT_COMPATIBILITY"]
      standard_refs:
        - "https://csrc.nist.gov/pubs/fips/180-4/upd1/final"
        - "https://csrc.nist.gov/pubs/fips/202/final"

  - id: HASH-SHA1-001
    priority: 60
    match:
      primitive_contains: ["sha-1", "sha1"]
      roles: ["hash"]
      statuses: ["deprecated_classically"]
    plan:
      target_algorithm: "SHA-256 or SHA3-256 assessment"
      target_standard: "FIPS 180-4 / FIPS 202"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "Hash purpose and compatibility requirements must be established before replacement."
      estimated_effort: "low"
      blocker_codes: ["HASH_PURPOSE_UNKNOWN", "FORMAT_COMPATIBILITY"]
      standard_refs:
        - "https://csrc.nist.gov/pubs/fips/180-4/upd1/final"
        - "https://csrc.nist.gov/pubs/fips/202/final"

  - id: HASH-SHA256-001
    priority: 40
    match:
      primitive_contains: ["sha-256", "sha256"]
      roles: ["hash"]
      statuses: ["quantum_security_reduced"]
    plan:
      target_algorithm: "Retain or assess SHA-384/SHA-512"
      target_standard: "FIPS 180-4"
      patch_available: false
      requires_manual_intervention: true
      intervention_reason: "SHA-256 already provides approximately 128-bit quantum preimage resistance; requirements determine whether change is needed."
      estimated_effort: "low"
      blocker_codes: ["SECURITY_TARGET_UNKNOWN", "FORMAT_COMPATIBILITY"]
      standard_refs: ["https://csrc.nist.gov/pubs/fips/180-4/upd1/final"]
