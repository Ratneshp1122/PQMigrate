<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQMigrate Assurance Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for in-browser JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { PieChart, Pie, Cell, Tooltip, ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Legend } = window.Recharts;

        // Colors
        const COLORS = {
            CRITICAL: '#ef4444',
            WARNING: '#f59e0b',
            SAFE: '#10b981',
            UNKNOWN: '#6b7280',
            ABSTAIN: '#8b5cf6'
        };

        const Dashboard = () => {
            const [report, setReport] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // Fetch the V2 schema report we generated
                fetch('../report_v2.json')
                    .then(res => res.json())
                    .then(data => {
                        setReport(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Failed to load JSON", err);
                        setLoading(false);
                    });
            }, []);

            if (loading) return <div className="flex h-screen items-center justify-center text-xl font-semibold">Loading cryptographic audit...</div>;
            if (!report) return (
                <div className="flex flex-col h-screen items-center justify-center space-y-4">
                    <div className="text-xl font-bold text-red-600">Error loading report_v2.json</div>
                    <div className="text-gray-600">Ensure this file is served over HTTP (e.g., using `python3 -m http.server`) or that your browser allows local file access.</div>
                </div>
            );

            // Metrics calculation
            const total = report.records.length;
            const abstentions = report.records.filter(r => r.plan.requires_manual_intervention).length;
            const automated = total - abstentions;
            
            // Charts data
            const confidenceData = [
                { name: 'Direct/Inferred (Automated Patch)', value: automated, color: COLORS.SAFE },
                { name: 'Ambiguous (Abstention)', value: abstentions, color: COLORS.ABSTAIN }
            ];

            return (
                <div className="min-h-screen bg-gray-50 p-8">
                    {/* Header */}
                    <div className="max-w-7xl mx-auto mb-8">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-3xl font-extrabold text-gray-900 tracking-tight">PQMigrate Assurance Dashboard</h1>
                                <p className="mt-2 text-sm text-gray-500">Project: <span className="font-mono bg-gray-200 px-2 py-1 rounded">{report.project_name}</span> | Scanned: {new Date(report.scan_timestamp).toLocaleString()}</p>
                            </div>
                            <div className="bg-white rounded-lg shadow px-6 py-3 border-l-4 border-indigo-500">
                                <div className="text-sm text-gray-500 font-medium">Compliance Framework</div>
                                <div className="text-lg font-bold text-indigo-700">FIPS 203 / 204 / RFC 10024</div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto grid grid-cols-1 gap-6 lg:grid-cols-3 mb-8">
                        {/* KPI Cards */}
                        <div className="bg-white rounded-xl shadow p-6 border-t-4 border-blue-500">
                            <h3 className="text-sm font-semibold text-gray-500">Files Scanned</h3>
                            <p className="text-4xl font-black mt-2 text-gray-800">{report.files_scanned}</p>
                        </div>
                        <div className="bg-white rounded-xl shadow p-6 border-t-4 border-red-500">
                            <h3 className="text-sm font-semibold text-gray-500">Vulnerable Findings (Total)</h3>
                            <p className="text-4xl font-black mt-2 text-gray-800">{total}</p>
                        </div>
                        <div className="bg-white rounded-xl shadow p-6 border-t-4 border-purple-500">
                            <h3 className="text-sm font-semibold text-gray-500">Manual Interventions (Abstentions)</h3>
                            <p className="text-4xl font-black mt-2 text-purple-700">{abstentions}</p>
                            <p className="text-xs text-gray-400 mt-1">Due to ambiguous AST semantics (ADR-001)</p>
                        </div>
                    </div>

                    {/* Data Table */}
                    <div className="max-w-7xl mx-auto bg-white shadow rounded-xl overflow-hidden">
                        <div className="px-6 py-5 border-b border-gray-200">
                            <h3 className="text-lg leading-6 font-medium text-gray-900">Cryptographic Operations & Migration Plans</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Primitive</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Semantics</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Migration Target</th>
                                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {report.records.map((r, i) => (
                                        <tr key={i} className="hover:bg-gray-50 transition-colors">
                                            <td className="px-6 py-4 whitespace-nowrap">
                                                <div className="text-sm text-gray-900 font-medium truncate max-w-[200px]" title={r.finding.location.file_path}>
                                                    {r.finding.location.file_path.split('/').pop()}
                                                </div>
                                                <div className="text-xs text-gray-500">Line {r.finding.location.line_number}</div>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap">
                                                <span className="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">
                                                    {r.finding.primitive_name}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap">
                                                <div className="text-sm text-gray-900 capitalize">{r.finding.operation}</div>
                                                <div className="text-xs text-gray-500 capitalize">{r.finding.role}</div>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap">
                                                <div className="text-sm font-bold text-gray-900">{r.plan.target_algorithm}</div>
                                                <div className="text-xs text-gray-500">{r.plan.target_standard}</div>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap">
                                                {r.plan.requires_manual_intervention ? (
                                                    <span className="px-3 py-1 text-xs font-bold rounded-full bg-purple-100 text-purple-800 border border-purple-200 shadow-sm">
                                                        ABSTAINED
                                                    </span>
                                                ) : (
                                                    <span className="px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800 border border-green-200 shadow-sm">
                                                        AUTO-PATCH
                                                    </span>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
